<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kids Gate | تسجيل الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#BFE8F5;
    --grass:#7CB342;
    --grass-dark:#5C8F2A;
    --orange:#F7941D;
    --purple:#9B59B6;
    --blue:#3FB3E0;
    --sand:#F5C242;
    --cream:#FFFDF6;
    --ink:#2B3A3A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    background:var(--cream);
    overflow-x:hidden;
  }

  /* ============ APP SHELL ============ */
  .app{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
  }
  .screen{
    position:absolute;
    inset:0;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    opacity:1;
    transform:translateX(0);
    transition:opacity .45s ease, transform .45s ease;
  }
  .screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  #screenHome.hidden{ transform:translateX(6%); }
  #screenForm{ transform:translateX(6%); opacity:0; pointer-events:none; }
  #screenForm.active{ transform:translateX(0); opacity:1; pointer-events:auto; }

  /* ============ HOME SCREEN ============ */
  #screenHome{
    background-image:url('kidsgate-hero.png');
    background-size:cover;
    background-position:center 20%;
    background-repeat:no-repeat;
    justify-content:flex-end;
    align-items:center;
    padding-bottom:9%;
  }
  .path-btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Baloo Bhaijaan 2', sans-serif;
    background:var(--orange);
    color:#fff;
    font-size:clamp(20px, 3.2vw, 28px);
    font-weight:700;
    padding:18px 52px;
    border-radius:100px;
    border:5px solid #fff;
    box-shadow:0 10px 0 #C96F0E, 0 18px 30px rgba(0,0,0,0.18);
    display:inline-flex;
    align-items:center;
    gap:12px;
    transition:transform .15s ease, box-shadow .15s ease;
    animation:bob 2.6s ease-in-out infinite;
  }
  .path-btn:hover{ transform:translateY(3px); box-shadow:0 7px 0 #C96F0E, 0 14px 24px rgba(0,0,0,0.18); }
  .path-btn:active{ transform:translateY(10px); box-shadow:0 0 0 #C96F0E, 0 8px 14px rgba(0,0,0,0.18); }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  .path-hint{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--grass-dark);
    background:rgba(255,255,255,0.85);
    padding:6px 16px;
    border-radius:100px;
    margin-bottom:14px;
  }

  /* ============ FORM SCREEN ============ */
  #screenForm{
    background:
      radial-gradient(circle at 14% 12%, rgba(63,179,224,0.22) 0, transparent 38%),
      radial-gradient(circle at 88% 8%, rgba(155,89,182,0.18) 0, transparent 36%),
      radial-gradient(circle at 90% 92%, rgba(124,179,66,0.22) 0, transparent 40%),
      radial-gradient(circle at 6% 90%, rgba(247,148,29,0.18) 0, transparent 38%),
      var(--cream);
    justify-content:center;
    align-items:center;
    padding:28px 18px;
    overflow-y:auto;
  }
  .back-btn{
    position:absolute;
    top:20px;
    right:20px;
    background:#fff;
    border:2px solid rgba(43,58,58,0.12);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:9px 18px;
    border-radius:100px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .card{
    background:#fff;
    width:100%;
    max-width:440px;
    border-radius:32px;
    padding:38px 30px 32px;
    box-shadow:0 24px 60px -18px rgba(43,58,58,0.25);
    border:4px solid #fff;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-10px; right:-10px;
    width:44px; height:44px;
    background:var(--blue);
    border-radius:50%;
    border:4px solid #fff;
  }
  .card::after{
    content:"";
    position:absolute;
    bottom:-8px; left:-8px;
    width:30px; height:30px;
    background:var(--sand);
    border-radius:50%;
    border:4px solid #fff;
  }
  .card h1{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:700;
    font-size:clamp(24px, 5vw, 30px);
    color:var(--grass-dark);
    text-align:center;
    margin-bottom:6px;
  }
  .card p.sub{
    text-align:center;
    font-size:14px;
    color:rgba(43,58,58,0.6);
    margin-bottom:26px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:700;
    margin-bottom:7px;
    color:var(--ink);
  }
  .field input, .field select{
    width:100%;
    font-family:'Tajawal', sans-serif;
    font-size:15.5px;
    font-weight:500;
    padding:14px 18px;
    border-radius:16px;
    border:2px solid #EDEAE0;
    background:#FBFAF6;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .field input:focus, .field select:focus{
    border-color:var(--orange);
    background:#fff;
  }
  .field select{
    appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%232B3A3A' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:left 18px center;
  }
  .submit-btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    font-family:'Baloo Bhaijaan 2', sans-serif;
    background:var(--orange);
    color:#fff; font-size:19px; font-weight:700;
    padding:16px; border-radius:18px; margin-top:8px;
    box-shadow:0 6px 0 #C96F0E;
    transition:transform .12s ease, box-shadow .12s ease, opacity .15s ease;
  }
  .submit-btn:hover{ transform:translateY(2px); box-shadow:0 4px 0 #C96F0E; }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }

  .error-box{
    display:none;
    background:rgba(226,80,65,0.1);
    color:#C0392B;
    border:1.5px solid rgba(226,80,65,0.3);
    padding:11px 14px; border-radius:14px;
    font-size:13.5px; font-weight:700; text-align:center;
    margin-top:14px;
  }
  .error-box.show{ display:block; }

  /* ============ SUCCESS ============ */
  .success{ display:none; text-align:center; }
  .success.show{ display:block; animation:pop .4s ease; }
  @keyframes pop{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  .stamp{
    width:80px; height:80px; border-radius:50%;
    background:var(--grass);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:38px; margin:6px auto 18px;
    box-shadow:0 0 0 6px rgba(124,179,66,0.18);
  }
  .success h2{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:700; font-size:24px; color:var(--grass-dark); margin-bottom:8px;
  }
  .success p{ font-size:14.5px; color:rgba(43,58,58,0.65); line-height:1.8; margin-bottom:20px;}
  .again-btn{
    appearance:none; border:2px solid var(--grass); background:#fff; color:var(--grass-dark);
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:14px;
    padding:11px 22px; border-radius:100px; cursor:pointer;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 480px){
    #screenHome{ padding-bottom:11%; background-position:center 12%; }
    .path-btn{ padding:15px 38px; }
  }
  @media (min-width: 768px) and (max-width: 1180px){
    /* iPad portrait & landscape */
    #screenHome{ background-position:center 25%; padding-bottom:7%; }
    .card{ max-width:480px; padding:44px 40px 38px; }
  }
  @media (orientation: landscape) and (max-height: 600px){
    #screenForm{ align-items:flex-start; padding-top:26px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ HOME SCREEN ============ -->
  <section id="screenHome" class="screen">
    <div class="path-hint">اليوم المفتوح 🎈</div>
    <button class="path-btn" onclick="goTo('form')">
      سجّل حضورك
    </button>
  </section>

  <!-- ============ FORM SCREEN ============ -->
  <section id="screenForm" class="screen">
    <button class="back-btn" onclick="goTo('home')">→ رجوع</button>

    <div class="card">
      <div id="formWrap">
        <h1>سجّل حضورك</h1>
        <p class="sub">عبّي بياناتك عشان نستقبلك في اليوم المفتوح</p>

        <form id="attendanceForm">
          <div class="field">
            <label for="parentName">اسم ولي الأمر</label>
            <input type="text" id="parentName" required>
          </div>
          <div class="field">
            <label for="phone">رقم الجوال</label>
            <input type="tel" id="phone" placeholder="05xxxxxxxx" pattern="^05[0-9]{8}$" required>
          </div>
          <div class="field">
            <label for="childName">اسم الطفل</label>
            <input type="text" id="childName" required>
          </div>
          <div class="field">
            <label for="stage">المرحلة الدراسية</label>
            <select id="stage" required>
              <option value="" disabled selected>اختر المرحلة</option>
              <option value="رياض الأطفال">رياض الأطفال</option>
              <option value="تمهيدي">تمهيدي</option>
              <option value="KG1">KG1</option>
              <option value="KG2">KG2</option>
            </select>
          </div>

          <div class="error-box" id="errorBox">صار خطأ في الإرسال، تأكد من الإنترنت وحاول مرة ثانية.</div>
          <button type="submit" class="submit-btn" id="submitBtn">تأكيد الحضور</button>
        </form>
      </div>

      <div class="success" id="successBox">
        <div class="stamp">✓</div>
        <h2>تم التسجيل بنجاح</h2>
        <p>يسعدنا استقبالكم في Kids Gate خلال اليوم المفتوح 🎉</p>
        <button class="again-btn" onclick="resetForm()">تسجيل عائلة أخرى</button>
      </div>
    </div>
  </section>

</div>

<script>
  function goTo(screen){
    const home = document.getElementById('screenHome');
    const form = document.getElementById('screenForm');
    if(screen === 'form'){
      home.classList.add('hidden');
      form.classList.add('active');
    } else {
      home.classList.remove('hidden');
      form.classList.remove('active');
    }
  }

  /* =========================================================================
     ⚙️ اربط الفورم بجوجل من هنا (بدّل القيم الثلاث):
     ========================================================================= */
  const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/PASTE_YOUR_FORM_ID_HERE/formResponse";
  const ENTRY_IDS = {
    parentName: "entry.111111111",
    phone:      "entry.222222222",
    childName:  "entry.333333333",
    stage:      "entry.444444444"
  };
  /* ========================================================================= */

  const form = document.getElementById('attendanceForm');
  const submitBtn = document.getElementById('submitBtn');
  const successBox = document.getElementById('successBox');
  const errorBox = document.getElementById('errorBox');
  const formWrap = document.getElementById('formWrap');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = "جارِ الإرسال...";

    const data = new FormData();
    data.append(ENTRY_IDS.parentName, document.getElementById('parentName').value);
    data.append(ENTRY_IDS.phone, document.getElementById('phone').value);
    data.append(ENTRY_IDS.childName, document.getElementById('childName').value);
    data.append(ENTRY_IDS.stage, document.getElementById('stage').value);

    try{
      await fetch(GOOGLE_FORM_ACTION_URL, { method:'POST', mode:'no-cors', body:data });
      formWrap.style.display = 'none';
      successBox.classList.add('show');
    } catch(err){
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = "تأكيد الحضور";
    }
  });

  function resetForm(){
    form.reset();
    formWrap.style.display = 'block';
    successBox.classList.remove('show');
    submitBtn.disabled = false;
    submitBtn.textContent = "تأكيد الحضور";
  }
</script>

</body>
</html>
